<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mongering Asians – Affiliate Gallery Catalog</title>
  <meta name="description" content="Searchable gallery of Ghost Cash FHGs, Content ZIPs and Video ad tools with tracking links." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Mongering Asians</h1>
      <p class="tagline">Searchable catalog of FHGs • Content ZIPs • Videos</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input type="search" id="search" placeholder="Search title, site, type…" autocomplete="off" />
      <div class="filters">
        <select id="typeFilter">
          <option value="">All types</option>
          <option value="FHG">FHG</option>
          <option value="Content ZIP">Content ZIP</option>
          <option value="Video">Video</option>
        </select>
        <select id="siteFilter">
          <option value="">All sites</option>
        </select>
        <button id="resetBtn" type="button">Reset</button>
      </div>
      <p id="count" class="count"></p>
    </section>

    <section id="grid" class="grid"></section>
    <div id="empty" class="empty" hidden>No results match your filters.</div>
  </main>

  <footer>
    <div class="container">
      <p>Affiliate catalog built from Ghost Cash ad tools. All links use tracking IDs.</p>
      <p class="small">Thumbnails & content remain on the original network. This is a catalog only.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
