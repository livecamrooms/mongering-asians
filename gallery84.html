<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gallery 84 – Mongering Asians</title>
<link rel="stylesheet" href="styles.css"/>
<style>
.nav{display:flex;gap:.3rem;justify-content:center;margin:1rem 0 0;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;font-size:.68rem;padding:.22rem .4rem;border-radius:5px;border:1px solid var(--border)}
.nav a:hover,.nav a.active{color:var(--text);border-color:var(--accent2);background:#1a1a28}
.pager{display:flex;align-items:center;justify-content:center;gap:.75rem;flex-wrap:wrap;margin:1rem 0 1.25rem}
.pager.bottom{margin:1.75rem 0 .5rem}
.page-btn{display:inline-block;padding:.45rem 1rem;border-radius:8px;border:1px solid var(--border);background:#1a1a28;color:var(--text);text-decoration:none;font-size:.85rem;font-weight:600}
.page-btn:hover{border-color:var(--accent2)}
.page-btn.disabled{opacity:.35;pointer-events:none}
.page-info{color:var(--muted);font-size:.85rem;min-width:7rem;text-align:center}
.page-jump{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted)}
.page-jump select{background:#1a1a28;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.3rem .4rem;font-size:.8rem}
.set{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.5rem;overflow:hidden}
.set-header{padding:.9rem 1.1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;justify-content:space-between;border-bottom:1px solid var(--border)}
.set-header h2{font-size:1rem;font-weight:600;flex:1;min-width:180px}
.set-header .meta{color:var(--muted);font-size:.8rem}
.set-header a{text-decoration:none;font-size:.8rem;font-weight:600;padding:.4rem .85rem;border-radius:7px;background:var(--accent);color:#fff;white-space:nowrap}
.set-header a:hover{background:#e63e5c}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px}
.mosaic a{display:block;aspect-ratio:16/9;overflow:hidden;background:#111}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.mosaic a:hover img{transform:scale(1.04)}
@media(min-width:700px){.mosaic{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="container">
<h1>Mongering Asians</h1>
<p class="tagline">Multi-image galleries · Gallery 84</p>
<nav class="nav" id="sitenav"></nav>
</div></header>
<main class="container" style="padding-top:.5rem;padding-bottom:2.5rem">
<div class="pager"><a class="page-btn" href="gallery83.html">← Prev</a><span class="page-info">Gallery 84 / 100</span><a class="page-btn" href="gallery85.html">Next →</a>
<label class="page-jump">Go to <select id="jump" aria-label="Jump to gallery"></select></label>
</div>
<div id="main"></div>
<div class="pager bottom"><a class="page-btn" href="gallery83.html">← Prev</a><span class="page-info">Gallery 84 / 100</span><a class="page-btn" href="gallery85.html">Next →</a></div>
</main>
<footer><div class="container"><p class="small">Multi-image sets. Open uses tracking links.</p></div></footer>
<script>
(function(){
  const nav=document.getElementById('sitenav');
  let html='<a href="index.html">Catalog</a><a href="gallery.html">Featured</a>';
  for(let i=2;i<=100;i++){
    html+='<a href="gallery'+i+'.html"'+(i===61?' class="active"':'')+'>G'+i+'</a>';
  }
  nav.innerHTML=html;
  const jump=document.getElementById('jump');
  for(let i=2;i<=100;i++){
    const o=document.createElement('option');
    o.value='gallery'+i+'.html';o.textContent='G'+i;
    if(i===84)o.selected=true;jump.appendChild(o);
  }
  jump.onchange=function(){location.href=this.value};
})();
async function run(){
  const all=await(await fetch('galleries-meta.json')).json();
  const items=all.slice(1640, 1660);
  const main=document.getElementById('main');
  if(!items.length){main.innerHTML='<p style="color:#9a9aaa;text-align:center;padding:2rem">Sets loading…</p>';return}
  items.forEach(it=>{
    const set=document.createElement('section');set.className='set';
    const imgs=(it.images||[]).map(src=>'<a href="'+it.link+'" target="_blank" rel="noopener"><img src="'+src+'" alt="' + esc((it.title || 'Gallery image') + (it.site ? ' – ' + it.site : '')) + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'"/></a>').join('');
    set.innerHTML='<div class="set-header"><h2>'+esc(it.title||'Untitled')+'</h2><span class="meta">'+esc(it.site||'')+'</span><a href="'+it.link+'" target="_blank" rel="noopener">Open</a></div><div class="mosaic">'+imgs+'</div>';
    main.appendChild(set);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
run();
</script>
</body></html>
